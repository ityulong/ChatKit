apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    namespace 'com.stfalcon.chatkit'
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 34
        versionCode 1
        versionName '0.4.1'
        consumerProguardFiles 'proguard.txt'
    }

    // 你有一个多余的 android { ... } 块，我已经将其合并了
    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 1. 在 android 块中添加 publishing 配置
    publishing {
        singleVariant("release") {
            // （可选）如果你想同时发布源码，可以在这里添加
            // withSourcesJar()
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// 2. 修改顶层的 publishing 块来引用组件
publishing {
    publications {
        // 创建一个名为 "release" 的 Maven publication
        release(MavenPublication) {
            // 通过 afterEvaluate 等待 android.publishing 配置完成后，
            // 再引用 "release" 组件
            afterEvaluate {
                from components.release
            }

            // 在这里自定义发布的属性
            groupId = 'com.github.stfalcon'
            artifactId = 'chatkit'
            version = '0.4.1'
        }
    }
    // 如果需要，在这里添加仓库配置
    // repositories { ... }
}